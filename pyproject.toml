[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wall-scraper-rate"
version = "1.0.0"
description = "Auditable MLB Statcast Wall-Scraper Rate research pipeline"
requires-python = ">=3.10"
dependencies = ["pybaseball>=2.2.7", "pandas>=2.0", "numpy>=1.24", "tqdm>=4.65"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
